<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saints Football — Velocity & Strength</title>
  <style>
    :root {
      --bg-dark: #070e18;
      --panel-dark: #0f1c2e;
      --panel-border: #1b2e4b;
      --gold: #d4af37;
      --gold-bright: #ffcc00;
      --navy: #002d62;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-hover: #1e3a66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Fixed Crisp Logo Header */
    header {
      background-color: var(--panel-dark);
      border-bottom: 2px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* SVG/IMG Scaled Proportions */
    .logo-container {
      height: 48px;
      width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-container svg,
    .logo-container img {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.6));
    }

    .titles h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .titles .sub {
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    nav button {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    nav button:hover {
      background: var(--panel-border);
      color: #fff;
    }

    nav button.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    main {
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    /* Cards & Grids */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-card .val {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Tables */
    .table-container {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      background: #0b1523;
      padding: 12px 16px;
      border-bottom: 2px solid var(--panel-border);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Settings & Ingest Box */
    .settings-panel {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .settings-panel h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--gold);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .settings-panel p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    textarea#pasteBox {
      width: 100%;
      height: 110px;
      background: #070e18;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 0.85rem;
      resize: vertical;
      margin-bottom: 16px;
    }

    .status-badges {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .badge {
      background: #070e18;
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      flex: 1;
      min-width: 140px;
    }

    .badge .name {
      font-weight: 700;
      color: #fff;
    }

    .badge .state {
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-secondary {
      background: #1b2e4b;
      color: #fff;
    }

    .field-row {
      margin-bottom: 16px;
    }

    .field-row label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field-row input[type="text"],
    .field-row input[type="number"] {
      width: 100%;
      background: #070e18;
      border: 1px solid var(--panel-border);
