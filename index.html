<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saints Football — Velocity & Strength</title>
  <style>
    body {
      margin: 0;
      background: #0b172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #070e1a;
      border-bottom: 2px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand svg {
      height: 46px;
      width: 46px;
      display: block;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      color: #fff;
    }
    .brand p {
      margin: 0;
      font-size: 0.8rem;
      color: #d4af37;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    nav button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    nav button.active {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }
    main {
      padding: 24px;
      max-width: 1100px;
      margin: auto;
    }
    .tab { display: none; }
    .tab.active { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #111e33;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .card .val {
      font-size: 1.6rem;
      color: #d4af37;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #111e33;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: #070e1a;
      color: #94a3b8;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: #070e1a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      margin: 8px 0 16px;
    }
    .btn {
      background: #d4af37;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- Clean Saints Gold Fleur-de-lis -->
      <svg viewBox="0 0 100 100">
        <path d="M50 8C48 24 37 34 26 38C38 42 42 53 42 66C37 66 31 64 26 60C28 72 38 80 50 80C62 80 72 72 74 60C69 64 63 66 58 66C58 53 62 42 74 38C63 34 52 24 50 8Z" fill="#D4AF37"/>
        <path d="M22 68C22 68 18 52 10 44C6 58 14 74 24 76C23 74 22 71 22 68Z" fill="#D4AF37"/>
        <path d="M78 68C78 68 82 52 90 44C94 58 86 74 76 76C77 74 78 71 78 68Z" fill="#D4AF37"/>
        <rect x="34" y="69" width="32" height="6" rx="3" fill="#0B172A" stroke="#D4AF37" stroke-width="2"/>
        <path d="M46 75L42 88H58L54 75H46Z" fill="#D4AF37"/>
      </svg>
      <div>
        <h1 id="progTitle">Saints Football — Velocity & Strength</h1>
        <p>Nansemond-Suffolk Academy</p>
      </div>
    </div>
    <nav>
      <button class="navBtn active" data-target="tab1">Overview</button>
      <button class="navBtn" data-target="tab2">Roster</button>
      <button class="navBtn" data-target="tab3">Settings & Sync</button>
    </nav>
  </header>

  <main>
    <div id="tab1" class="tab active">
      <div class="grid">
        <div class="card">
          <small>ATHLETES</small>
          <div class="val" id="cntAth">0</div>
        </div>
        <div class="card">
          <small>DATA ROWS</small>
          <div class="val" id="cntData">0</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Athlete</th>
            <th>Metric</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="overviewBody">
          <tr><td colspan="3" style="text-align:center; color:#94a3b8;">No data loaded. Use Settings & Sync.</td></tr>
        </tbody>
      </table>
    </div>

    <div id="tab2" class="tab">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>#</th>
            <th>Position</th>
            <th>Grad</th>
          </tr>
        </thead>
        <tbody id="rosterBody">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8;">No athletes listed.</td></tr>
        </tbody>
      </table>
    </div>

    <div id="tab3" class="tab">
      <h3>Quick Ingestion (Paste from Sheet)</h3>
      <textarea id="pasteBox" rows="4" placeholder="Paste data table here..."></textarea>
      
      <h3>Google Sheets Auto-Sync (CSV URLs)</h3>
      <label>Athletes Sheet CSV</label>
      <input type="text" id="urlAth" placeholder="https://docs.google.com/...output=csv">
      <label>Data Sheet CSV</label>
      <input type="text" id="urlData" placeholder="https://docs.google.com/...output=csv">
      
      <button class="btn" id="saveSync">Save & Sync Now</button>
      <p id="syncMsg" style="color: #d4af37; margin-top: 10px;"></p>
    </div>
  </main>

  <script>
    var db = { athletes: [], data: [], urls: { ath: '', dat: '' } };

    try {
      var saved = localStorage.getItem("saints_v26");
      if (saved) db = JSON.parse(saved);
    } catch(e) {}

    function renderUI() {
      document.getElementById("cntAth").innerText = db.athletes.length;
      document.getElementById("cntData").innerText = db.data.length;

      var rBody = document.getElementById("rosterBody");
      if (db.athletes.length) {
        rBody.innerHTML = db.athletes.map(function(a) {
          return "<tr><td>" + (a.Name||"") + "</td><td>" + (a["#"]||"") + "</td><td>" + (a.Position||"") + "</td><td>" + (a.Grad||"") + "</td></tr>";
        }).join("");
      }

      var oBody = document.getElementById("overviewBody");
      if (db.data.length) {
        oBody.innerHTML = db.data.map(function(d) {
          return "<tr><td>" + (d.Name||"") + "</td><td>" + (d.Metric||"") + "</td><td><b>" + (d.Value||"") + "</b></td></tr>";
        }).join("");
      }

      if (db.urls) {
        document.getElementById("urlAth").value = db.urls.ath || "";
        document.getElementById("urlData").value = db.urls.dat || "";
      }
    }

    function parseCSV(txt) {
      var lines = txt.trim().split("\n");
      if (!lines.length) return [];
      var delim = lines[0].indexOf("\t") > -1 ? "\t" : ",";
      var heads = lines[0].split(delim).map(function(h){ return h.trim().replace(/^"|"$/g, ''); });
      return lines.slice(1).map(function(l) {
        var row = l.split(delim).map(function(c){ return c.trim().replace(/^"|"$/g, ''); });
        var obj = {};
        heads.forEach(function(h, i) { obj[h] = row[i] || ""; });
        return obj;
      });
    }

    async function syncURL(url) {
      if (!url) return [];
      var bust = (url.indexOf("?") > -1 ? "&" : "?") + "_t=" + Date.now();
      var r = await fetch(url + bust);
      var t = await r.text();
      return parseCSV(t);
    }

    async function runSync() {
      var msg = document.getElementById("syncMsg");
      msg.innerText = "Syncing with Google Sheets...";
      try {
        if (db.urls.ath) db.athletes = await syncURL(db.urls.ath);
        if (db.urls.dat) db.data = await syncURL(db.urls.dat);
        localStorage.setItem("saints_v26", JSON.stringify(db));
        msg.innerText = "✓ Synced successfully at " + new Date().toLocaleTimeString();
        renderUI();
      } catch(err) {
        msg.innerText = "⚠ Sync failed: " + err.message;
      }
    }

    // Tabs
    var btns = document.querySelectorAll(".navBtn");
    btns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        btns.forEach(function(b){ b.classList.remove("active"); });
        document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById(btn.getAttribute("data-target")).classList.add("active");
      });
    });

    // Manual Paste
    document.getElementById("pasteBox").addEventListener("paste", function(e) {
      var text = (e.clipboardData || window.clipboardData).getData("text");
      if (!text) return;
      var parsed = parseCSV(text);
      if (parsed.length) {
        var keys = Object.keys(parsed[0]).join(" ").toLowerCase();
        if (keys.indexOf("pos") > -1 || keys.indexOf("grad") > -1) {
          db.athletes = parsed;
        } else {
          db.data = parsed;
        }
        localStorage.setItem("saints_v26", JSON.stringify(db));
        renderUI();
      }
    });

    // Save URLs
    document.getElementById("saveSync").addEventListener("click", function() {
      db.urls.ath = document.getElementById("urlAth").value.trim();
      db.urls.dat = document.getElementById("urlData").value.trim();
      localStorage.setItem("saints_v26", JSON.stringify(db));
      runSync();
    });

    // Run on boot
    renderUI();
    if (db.urls && (db.urls.ath || db.urls.dat)) {
      runSync();
    }
  </script>
</body>
</html>
